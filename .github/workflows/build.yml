name: Deploy to Vercel

on:
  push:
    branches: [main, arena/4feb02cc-maxhals-forensics]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & build
        run: |
          npm ci || npm install
          npm run build

